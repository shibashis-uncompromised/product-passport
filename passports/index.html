<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Product Passports — Uncompromised</title>
<link rel="icon" href="../assets/mark-dark.svg">
<link rel="stylesheet" href="_shared/passport.css">
<style>
  .explore-main{max-width:760px;margin:0 auto;padding:40px 32px 60px}
  .explore-head{border-bottom:3px solid var(--ink);padding-bottom:22px;margin-bottom:8px}
  .explore-head h1{font:36px/1.15 var(--serif);letter-spacing:-.025em;margin-top:10px}
  .explore-head p{color:var(--muted);font-size:15px;max-width:520px;margin-top:14px}
  .explore-list{border-top:2px solid var(--strong-rule);margin-top:10px}
  .explore-row{display:flex;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
  .explore-row:hover .explore-name{color:var(--accent)}
  .explore-id{font:20px/1 var(--mono);color:var(--accent);min-width:34px}
  .explore-id span{display:block;font:10px/1.6 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
  .explore-copy{flex:1;min-width:0}
  .explore-name{font:22px/1.3 var(--serif);display:block;transition:color .15s}
  .explore-meta{display:block;font-size:13px;color:var(--muted);margin-top:4px}
  .explore-link{font:11px/1.6 var(--mono);color:var(--muted);white-space:nowrap;text-align:right}
  .explore-link strong{display:block;color:var(--ink);font-size:13px}
  @media(max-width:540px){
    .explore-main{padding:28px 20px 44px}
    .explore-head h1{font-size:27px}
    .explore-row{gap:12px;padding:16px 0}
    .explore-name{font-size:18px}
    .explore-link{display:none}
  }
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<div class="header-main">
<a class="home-link header-brand" href="./">
<img src="../assets/mark-dark.svg" class="theme-dark" alt="" width="25" height="25">
<img src="../assets/mark-light.svg" class="theme-light" alt="" width="25" height="25">
<span class="passport-header-title">Product passports</span>
</a>
<button id="theme-toggle" class="icon-button" aria-label="Switch to light theme">
<svg class="theme-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
<svg class="theme-light" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.9 14.6A8.6 8.6 0 0 1 9.4 3.1 9 9 0 1 0 20.9 14.6Z"></path></svg>
</button>
</div>
</div>
</header>
<main class="explore-main">
<div class="explore-head">
<span class="eyebrow muted">Uncompromised · Product Passports</span>
<h1>Explore the 10 crop records</h1>
<p>Open any record directly, or jump straight to one with its short link — <span id="base-url-sample">baseurl</span>/#/&lt;id&gt;, id 1&ndash;10.</p>
</div>
<div class="explore-list" id="explore-list"></div>
</main>
<div id="live-status" class="sr-only" aria-live="polite"></div>
<script>
(function(){
  // id -> passport folder. Order matches how the 10 records were built.
  var CROPS = [
    {id:1,  slug:'kala-chana',    name:'Kala Chana',    hindi:'काला चना', farm:'Sarai 1'},
    {id:2,  slug:'masoor-dal',    name:'Masoor Dal',    hindi:'मसूर दाल', farm:'Sarai 1'},
    {id:3,  slug:'regular-wheat', name:'Regular Wheat', hindi:'गेहूँ',     farm:'Sarai 1'},
    {id:4,  slug:'bansi-wheat',   name:'Bansi Wheat',   hindi:'बंसी गेहूँ', farm:'Sarai 2'},
    {id:5,  slug:'bhaliya-wheat', name:'Bhaliya Wheat', hindi:'भालिया गेहूँ', farm:'Bujra'},
    {id:6,  slug:'chia-seeds',    name:'Chia Seeds',    hindi:'चिया बीज', farm:'Sarai 1'},
    {id:7,  slug:'flaxseeds',     name:'Flaxseeds',     hindi:'अलसी',      farm:'Sarai 1'},
    {id:8,  slug:'urad-dal',      name:'Urad Dal',      hindi:'उड़द दाल', farm:'Sarai 1'},
    {id:9,  slug:'moong-dal',     name:'Moong Dal',     hindi:'मूंग दाल', farm:'Sarai 1'},
    {id:10, slug:'turmeric',      name:'Turmeric',      hindi:'हल्दी',     farm:'Bujra'}
  ];
  var BY_ID = {};
  CROPS.forEach(function(c){ BY_ID[c.id] = c; });

  // ---- theme (same behaviour as the passport pages) ----
  var storage = {get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
                  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
  var themeButton = document.getElementById('theme-toggle');
  function setTheme(theme){
    document.documentElement.dataset.theme = theme;
    themeButton.setAttribute('aria-label', 'Switch to ' + (theme==='dark'?'light':'dark') + ' theme');
    document.querySelector('meta[name="theme-color"]').content = theme==='dark' ? '#050505' : '#faf8f3';
  }
  setTheme(storage.get('passport-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark'));
  themeButton.addEventListener('click', function(){
    var theme = document.documentElement.dataset.theme==='dark' ? 'light':'dark';
    setTheme(theme); storage.set('passport-theme', theme);
  });

  // ---- id -> passport router. Reads the id from a hash route (#/3 or #3),
  // a query string (?id=3), or a path segment (/3) -- whichever style the
  // link used -- so a short link works the same however it's hosted, with
  // no server rewrite rules required (hash and query both work on any
  // static host, or a plain local file). ----
  function getRequestedId(){
    var h = location.hash.match(/^#\/?(\d{1,2})\/?$/);
    if (h) return h[1];
    var q = new URLSearchParams(location.search).get('id');
    if (q) return q;
    var p = location.pathname.match(/\/(\d{1,2})\/?$/);
    if (p) return p[1];
    return null;
  }
  function routeIfRequested(){
    var requestedId = getRequestedId();
    if (requestedId && BY_ID[requestedId]) {
      location.replace(BY_ID[requestedId].slug + '/index.html');
      return true;
    }
    return false;
  }
  var redirected = routeIfRequested();
  // A hash-only change (e.g. clicking a #/3 link while already on this page,
  // or using back/forward between hash states) doesn't reload the document,
  // so re-check whenever the hash changes rather than only at page load.
  window.addEventListener('hashchange', routeIfRequested);

  // ---- explore list (skip building it if we're already redirecting away) ----
  if (!redirected) {
    document.getElementById('base-url-sample').textContent = location.href.replace(/[#?].*$/, '').replace(/\/$/, '');
    var list = document.getElementById('explore-list');
    CROPS.forEach(function(c){
      var a = document.createElement('a');
      a.className = 'explore-row';
      a.href = c.slug + '/index.html';
      a.innerHTML =
        '<span class="explore-id">' + c.id + '<span>id</span></span>' +
        '<span class="explore-copy"><span class="explore-name">' + c.name + '</span>' +
        '<span class="explore-meta">' + c.hindi + ' · ' + c.farm + '</span></span>' +
        '<span class="explore-link">Short link<strong>#/' + c.id + '</strong></span>';
      list.appendChild(a);
    });
  }
})();
</script>
</body>
</html>
