<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Product Passports — Uncompromised</title>
<meta name="description" content="Explore the Uncompromised product passports — full field-to-pack traceability for every crop.">
<link rel="icon" href="/assets/mark-dark.svg">
<link rel="stylesheet" href="/passports/_shared/passport.css">
<style>
  .home-main{max-width:960px;margin:0 auto;padding:44px 32px 72px}
  .home-head{border-bottom:3px solid var(--ink);padding-bottom:26px;margin-bottom:26px}
  .home-head h1{font:40px/1.12 var(--serif);letter-spacing:-.025em;margin-top:12px}
  .home-head p{color:var(--muted);font-size:15px;max-width:560px;margin-top:16px}
  .home-count{float:right;font:13px/1 var(--mono);color:var(--muted);margin-top:6px}
  .home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .home-card{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 22px 20px;
    border:1px solid var(--rule);background:var(--surface);text-decoration:none;color:inherit;
    transition:border-color .16s,transform .16s}
  .home-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .home-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .home-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .home-kind{font:10px/1.6 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--rule);padding:3px 8px;border-radius:20px}
  .home-num{font:15px/1 var(--mono);color:var(--accent)}
  .home-num span{color:var(--muted)}
  .home-name{font:26px/1.2 var(--serif);letter-spacing:-.015em}
  .home-card:hover .home-name{color:var(--accent)}
  .home-hindi{font-size:15px;color:var(--muted);margin-left:8px}
  .home-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-top:1px solid var(--rule);padding-top:14px;margin-top:2px;
    font:12px/1.5 var(--mono);color:var(--muted)}
  .home-meta .go{color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .home-card:hover .home-meta .go{color:var(--accent)}
  .home-foot{margin-top:34px;color:var(--muted);font:12px/1.6 var(--mono);
    border-top:1px solid var(--rule);padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .home-foot a{color:inherit}
  @media(max-width:640px){
    .home-main{padding:30px 20px 52px}
    .home-head h1{font-size:30px}
    .home-grid{grid-template-columns:1fr;gap:12px}
    .home-name{font-size:22px}
  }
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<div class="header-main">
<a class="home-link header-brand" href="/">
<img src="/assets/mark-dark.svg" class="theme-dark" alt="" width="25" height="25">
<img src="/assets/mark-light.svg" class="theme-light" alt="" width="25" height="25">
<strong class="passport-header-title">Product passports</strong>
</a>
<button id="theme-toggle" class="icon-button" aria-label="Switch to light theme">
<svg class="theme-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
<svg class="theme-light" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.9 14.6A8.6 8.6 0 0 1 9.4 3.1 9 9 0 1 0 20.9 14.6Z"></path></svg>
</button>
</div>
</div>
</header>
<main class="home-main">
<div class="home-head">
<span class="home-count" id="home-count"></span>
<span class="eyebrow muted">Uncompromised · Traceability</span>
<h1>Our products</h1>
<p>Every crop we grow carries a passport — the real field record from farm to pack. Pick a product to open its passport.</p>
</div>
<div class="home-grid" id="home-grid"></div>
<div class="home-foot">
<span>Field-to-pack records · Udaipur clusters</span>
<a href="mailto:traceability@uncompromised.in">traceability@uncompromised.in</a>
</div>
</main>

<script src="/products.js"></script>
<script>
(function () {
  // ---- theme (matches the passport pages, shares the same stored preference) ----
  var storage = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var themeButton = document.getElementById('theme-toggle');
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeButton.setAttribute('aria-label', 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' theme');
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#050505' : '#faf8f3';
  }
  setTheme(storage.get('passport-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  themeButton.addEventListener('click', function () {
    var theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    setTheme(theme); storage.set('passport-theme', theme);
  });

  // ---- product grid ----
  var products = window.PRODUCTS || [];
  document.getElementById('home-count').textContent = products.length + ' products';
  var grid = document.getElementById('home-grid');
  products.forEach(function (p) {
    var a = document.createElement('a');
    a.className = 'home-card';
    a.href = '/p/' + p.n;                       // clean short link -> loader -> passport
    a.setAttribute('aria-label', p.name + ' passport');
    a.innerHTML =
      '<div class="home-card-top">' +
        '<span class="home-kind">' + p.kind + '</span>' +
        '<span class="home-num"><span>/p/</span>' + p.n + '</span>' +
      '</div>' +
      '<div><span class="home-name">' + p.name + '</span>' +
        '<span class="home-hindi">' + p.hindi + '</span></div>' +
      '<div class="home-meta"><span>' + p.farm + '</span>' +
        '<span class="go">Open passport →</span></div>';
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
