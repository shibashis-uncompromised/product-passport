<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<title>Opening Urad Dal… — Uncompromised</title>
<link rel="icon" href="/assets/mark-dark.svg">
<link rel="stylesheet" href="/passports/_shared/passport.css">
<!-- No-JS / instant fallback: still lands on the passport. -->
<meta http-equiv="refresh" content="1; url=/passports/urad-dal/">
<style>.loader-brand{width:180px;height:auto;margin-bottom:6px}.loader-num{font:13px/1.5 var(--mono);color:var(--accent)}</style>
</head>
<body>
<div class="scan-screen">
<img src="/assets/wordmark-dark.svg" class="loader-brand theme-dark" alt="Uncompromised">
<img src="/assets/wordmark-light.svg" class="loader-brand theme-light" alt="Uncompromised">
<span class="scan-spinner" aria-hidden="true"></span>
<strong>Opening Urad Dal passport…</strong>
<span class="eyebrow loader-num">उड़द दाल · /p/60</span>
</div>
<script>
(function(){
  try{var t=localStorage.getItem('passport-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
    document.documentElement.dataset.theme=t;
    if(t==='light')document.querySelector('meta[name=\"theme-color\"]').content='#faf8f3';}catch(e){}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){location.replace('/passports/urad-dal/');}, reduce?150:750);
})();
</script>
</body>
</html>
